version: '3.3'  

services:
  hugin:
    image: klakegg/hugo:0.107.0-ext-alpine
    volumes:
      - ".:/src"
    ports:
      - "1313:1313"
    command: server -D --baseURL localhost:1313 --appendPort=false
    # command: server -D --baseURL larskaggdata.se --appendPort=false
    networks:
      - valhalla

networks:
  valhalla:
    driver: bridge
